name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip install PyYAML

      - name: Generate Binary Asset Manifests
        run: python3 runtime/generate_assets_header.py

      - name: Generate App Icons
        run: |
          # Check if master icon exists before running your script
          if [ -f "master_icon.png" ]; then
            python3 runtime/generate_icons.py master_icon.png
          else
            echo "!! WARNING: master_icon.png not found in root. Using fallback to prevent packaging failure !!"
            mkdir -p Android/app/src/main/res/mipmap-mdpi
            convert -size 48x48 xc:blue Android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert -size 48x48 xc:blue Android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          fi

      - name: Prepare C++ Source (Harmonizer)
        run: python3 runtime/prepare_source.py

      - name: Build with Gradle
        run: |
          # Locate gradlew dynamically
          GRADLEW_PATH=$(find . -name gradlew)
          chmod +x "$GRADLEW_PATH"
          cd $(dirname "$GRADLEW_PATH")
          
          # Clean is mandatory to ensure the new icons and harmonized C++ files are indexed
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BKA-debug-apk
          path: "Android/app/build/outputs/apk/debug/*.apk"
