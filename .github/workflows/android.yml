name: Android Build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize git submodules
        run: git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: "34.0.0"
          ndk: "27.3.10554745"

      # ---------- Pre-processing Step ----------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install PyYAML

      - name: Generate Asset Manifest Header
        run: python runtime/generate_assets_header.py

      # ---------- Native Build Tools ----------
      - name: Install CMake 3.24.1
        run: |
          CMAKE_VERSION=3.24.1
          CMAKE_DIR=$HOME/cmake-$CMAKE_VERSION
          mkdir -p $CMAKE_DIR
          curl -L -o /tmp/cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v$CMAKE_VERSION/cmake-$CMAKE_VERSION-linux-x86_64.tar.gz
          tar -xzf /tmp/cmake.tar.gz --strip-components=1 -C $CMAKE_DIR
          echo "$CMAKE_DIR/bin" >> $GITHUB_PATH

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      # ---------- Generate Launcher Icons ----------
      - name: Generate Android launcher icons
        run: |
          ICON_DIR=Android/app/src/main/res
          BASE_ICON=/tmp/ic_launcher.png
          ROUND_ICON=/tmp/ic_launcher_round.png
          rm -f $ICON_DIR/mipmap-*/ic_launcher*.png
          convert -size 1024x1024 xc:"#4B0082" -gravity center -fill "#FFD700" -font DejaVu-Sans-Bold -pointsize 160 -annotate +0+0 "B.K.A" "$BASE_ICON"
          convert "$BASE_ICON" \( -size 1024x1024 xc:none -fill white -draw "circle 512,512 512,0" \) -compose copyopacity -composite "$ROUND_ICON"
          mkdir -p $ICON_DIR/mipmap-mdpi $ICON_DIR/mipmap-hdpi $ICON_DIR/mipmap-xhdpi $ICON_DIR/mipmap-xxhdpi $ICON_DIR/mipmap-xxxhdpi
          for SIZE in 48 72 96 144 192; do
            DENSITY=$(echo $SIZE | awk '{print ($1==48?"mdpi":($1==72?"hdpi":($1==96?"xhdpi":($1==144?"xxhdpi":"xxxhdpi"))))}')
            convert "$BASE_ICON" -resize ${SIZE}x${SIZE} $ICON_DIR/mipmap-$DENSITY/ic_launcher.png
            convert "$ROUND_ICON" -resize ${SIZE}x${SIZE} $ICON_DIR/mipmap-$DENSITY/ic_launcher_round.png
          done

      # ---------- Gradle Build ----------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            Android/app/build
          key: gradle-${{ runner.os }}-${{ hashFiles('Android/**/*.gradle*', 'gradle-wrapper.properties') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :Android:app:assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BKA-debug-apk
          path: Android/app/build/outputs/apk/debug/*.apk
