name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # ---------- Checkout ----------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ---------- Java ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ---------- ImageMagick ----------
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      # ---------- Generate Launcher Icons ----------
      - name: Generate Android launcher icons
        run: |
          # Use the path verified from your file dump
          RES_DIR=Android/app/src/main/res
          BASE_ICON=/tmp/ic_launcher.png
          ROUND_ICON=/tmp/ic_launcher_round.png

          convert -size 1024x1024 xc:"#4B0082" \
            -gravity center \
            -fill "#FFD700" \
            -font DejaVu-Sans-Bold \
            -pointsize 160 \
            -annotate +0+0 "B.K.A" \
            "$BASE_ICON"

          convert "$BASE_ICON" \
            \( -size 1024x1024 xc:none -fill white -draw "circle 512,512 512,0" \) \
            -compose copyopacity -composite \
            "$ROUND_ICON"

          declare -A DENSITIES=( ["mipmap-mdpi"]=48 ["mipmap-hdpi"]=72 ["mipmap-xhdpi"]=96 ["mipmap-xxhdpi"]=144 ["mipmap-xxxhdpi"]=192 )

          for DIR in "${!DENSITIES[@]}"; do
            SIZE=${DENSITIES[$DIR]}
            mkdir -p "$RES_DIR/$DIR"
            convert "$BASE_ICON" -resize ${SIZE}x${SIZE} "$RES_DIR/$DIR/ic_launcher.png"
            convert "$ROUND_ICON" -resize ${SIZE}x${SIZE} "$RES_DIR/$DIR/ic_launcher_round.png"
          done

      # ---------- Fix Permissions & Build ----------
      - name: Build with Gradle
        run: |
          # Find where gradlew actually is and run it from there
          GRADLEW_PATH=$(find . -name gradlew)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew not found in the repository!"
            ls -R
            exit 1
          fi
          chmod +x "$GRADLEW_PATH"
          
          # Move to the directory containing gradlew and build
          cd $(dirname "$GRADLEW_PATH")
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # ---------- Upload ----------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BKA-debug-apk
          path: Android/app/build/outputs/apk/debug/*.apk
