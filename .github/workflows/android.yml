name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip install PyYAML

      - name: Generate Binary Asset Manifests
        run: python3 runtime/generate_assets_header.py

      - name: Generate App Icons
        run: |
          if [ -f "master_icon.png" ]; then
            python3 runtime/generate_icons.py master_icon.png
          else
            echo "master_icon.png not found, building with dummy icon"
            mkdir -p Android/app/src/main/res/mipmap-mdpi
            convert -size 48x48 xc:gray Android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp Android/app/src/main/res/mipmap-mdpi/ic_launcher.png Android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          fi

      - name: Force clean CMake artifacts
        run: |
          rm -rf Android/app/.cxx               || true
          rm -rf Android/app/build              || true
          find Android -name "*.o" -delete      || true
          find Android -name "build.ninja" -delete || true

      - name: Full Gradle clean
        run: |
          GRADLEW_PATH=$(find . -name gradlew)
          chmod +x "$GRADLEW_PATH"
          cd $(dirname "$GRADLEW_PATH")
          ./gradlew clean --no-daemon --stacktrace --info

      - name: Prepare C++ Source
        run: python3 runtime/prepare_source.py

      - name: Verify patches landed
        run: |
          grep -c "SH-v75.50-preamble" decomp-files/src/core2/code_5BEB0.c \
            && echo "Preamble OK" || echo "Preamble NOT found"
          grep -c "SH: gbi.h injected" decomp-files/include/2.0L/ultra64.h \
            && echo "ultra64.h patch OK" || echo "ultra64.h patch NOT found"

grep -n "undef _GBI_H_" decomp-files/include/structs.h && echo "structs.h undef OK" || echo "structs.h undef NOT FOUND"
head -20 decomp-files/include/structs.h

      - name: Build with Gradle
        run: |
          GRADLEW_PATH=$(find . -name gradlew)
          chmod +x "$GRADLEW_PATH"
          cd $(dirname "$GRADLEW_PATH")
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            -Pandroid.forceJsonSchemaConfiguration=true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BKA-debug-apk
          path: "Android/app/build/outputs/apk/debug/*.apk"