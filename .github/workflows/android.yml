name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip install PyYAML

      - name: Generate Binary Asset Manifests
        run: |
          python3 runtime/generate_assets_header.py

      - name: Prepare C++ Source for Build
        run: |
          # Only run the script. DO NOT 'touch' CMakeLists.txt as it wipes your config.
          python3 runtime/prepare_source.py

      - name: Build with Gradle
        run: |
          # Using the 'find' logic that successfully located gradlew in your logs
          GRADLEW_PATH=$(find . -name gradlew)
          chmod +x "$GRADLEW_PATH"
          cd $(dirname "$GRADLEW_PATH")
          # 'clean' is mandatory to force CMake to see the new 'src/' structure
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BKA-debug-apk
          path: "Android/app/build/outputs/apk/debug/*.apk"
