name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install ImageMagick
      run: sudo apt-get update && sudo apt-get install -y imagemagick

    - name: Generate Icons
      run: |
        # Assumes you have a 'master_icon.png' in your root
        # If not, this step will skip without failing the build
        if [ -f "master_icon.png" ]; then
          python3 runtime/generate_icons.py master_icon.png
        else
          echo "No master_icon.png found, skipping icon generation."
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x Android/gradlew

    - name: Build with Gradle
      run: cd Android && ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: Android/app/build/outputs/apk/debug/app-debug.apk
