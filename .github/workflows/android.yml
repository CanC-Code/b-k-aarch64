name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip install PyYAML

      # Step 1: Generate C++ Asset Headers from assets.yaml
      - name: Generate C++ Asset Headers
        run: |
          if [ -f "assets.yaml" ]; then
            python3 runtime/generate_assets_header.py
          else
            echo "assets.yaml not found, skipping header generation."
          fi

      # Step 2: Generate Launcher Icons using your runtime script
      - name: Generate Android launcher icons
        run: |
          # Create a square 1024x1024 master if it doesn't exist
          if [ ! -f "master_icon.png" ]; then
            convert -size 1024x1024 xc:"#4B0082" \
              -gravity center \
              -fill "#FFD700" \
              -font DejaVu-Sans-Bold \
              -pointsize 160 \
              -annotate +0+0 "B.K.A" \
              master_icon.png
          fi
          
          python3 runtime/generate_icons.py master_icon.png

      # Step 3: Execute Android Build
      - name: Build with Gradle
        run: |
          GRADLEW_PATH=$(find . -name gradlew)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew not found!"
            exit 1
          fi
          chmod +x "$GRADLEW_PATH"
          cd $(dirname "$GRADLEW_PATH")
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BKA-debug-apk
          path: "Android/app/build/outputs/apk/debug/*.apk"
