name: Android Build
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Environment
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Assets for Embedding
        run: |
          mkdir -p Android/app/src/main/assets/
          # Ensure manifests exist and move them to assets
          cp decompressed.pal.yaml Android/app/src/main/assets/ || echo "PAL manifest missing"
          cp decompressed.us.v10.yaml Android/app/src/main/assets/ || echo "US manifest missing"

      - name: Generate Structural Header
        run: python runtime/generate_assets_header.py

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :Android:app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BKA-debug-apk
          path: Android/app/build/outputs/apk/debug/*.apk
