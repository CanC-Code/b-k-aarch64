name: Android Build
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip install PyYAML

      - name: Prepare C++ Source
        run: python3 runtime/prepare_source.py

      - name: Verify patches landed
        run: |
          echo "Checking Harmonizer Preamble..."
          # Using the new generic marker
          grep -c "SH-AUTOMORPH-ACTIVE" decomp-files/src/core1/audio/auxbus.c && echo "Preamble OK" || echo "Preamble NOT found"

      - name: Build with Gradle
        run: |
          set -o pipefail 
          GRADLEW_PATH=$(find . -name gradlew)
          chmod +x "$GRADLEW_PATH"
          cd $(dirname "$GRADLEW_PATH")
          ./gradlew assembleDebug --no-daemon --info 2>&1 | tee /tmp/build_full.log
        shell: bash

      - name: Inspect Build Errors on Failure
        if: failure()
        run: |
          grep -i "error:" /tmp/build_full.log | head -n 100 || echo "No errors found."
          grep -B 5 -A 10 "error:" /tmp/build_full.log | head -n 50 || true

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BKA-debug-apk
          path: "Android/app/build/outputs/apk/debug/*.apk"
