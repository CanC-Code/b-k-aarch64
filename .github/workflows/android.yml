name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip install PyYAML

      - name: Generate Binary Asset Manifests
        run: python3 runtime/generate_assets_header.py

      - name: Generate App Icons
        run: |
          if [ -f "master_icon.png" ]; then
            python3 runtime/generate_icons.py master_icon.png
          else
            echo "master_icon.png not found, building with dummy icon"
            mkdir -p Android/app/src/main/res/mipmap-mdpi
            convert -size 48x48 xc:gray Android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp Android/app/src/main/res/mipmap-mdpi/ic_launcher.png Android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          fi

      - name: Prepare C++ Source
        run: python3 runtime/prepare_source.py   # ← this is your harmonizer / source modifier

      # ── FORCE CMake full rebuild ────────────────────────────────────────
      - name: Force clean CMake artifacts (critical for source changes)
        run: |
          rm -rf Android/app/.cxx               || true
          rm -rf Android/app/build              || true   # also nuke build outputs
          find Android -name "*.o" -delete     || true
          find Android -name "build.ninja" -delete || true

      - name: Full Gradle clean
        run: |
          GRADLEW_PATH=$(find . -name gradlew)
          chmod +x "$GRADLEW_PATH"
          cd $(dirname "$GRADLEW_PATH")
          ./gradlew clean --no-daemon --stacktrace --info

      # Optional: confirm preamble is present (debug only — remove later)
      - name: Verify preamble landed in failing file
        run: |
          grep -A 10 "SourceHarmonizer v75.25" decomp-files/src/core2/code_5BEB0.c || echo "Preamble NOT found — check prepare_source.py execution"
          grep -A 5 "#define BOOL" decomp-files/src/core2/code_5BEB0.c || echo "BOOL define NOT found"

      - name: Build with Gradle
        run: |
          GRADLEW_PATH=$(find . -name gradlew)
          chmod +x "$GRADLEW_PATH"
          cd $(dirname "$GRADLEW_PATH")
          ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BKA-debug-apk
          path: "Android/app/build/outputs/apk/debug/*.apk"