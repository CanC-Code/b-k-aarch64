name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip install PyYAML

      # Step 1: Generate Binary Asset Manifests
      - name: Generate Binary Asset Manifests
        run: |
          python3 runtime/generate_assets_header.py
          if [ -f "Android/app/src/main/assets/manifest_us.bin" ]; then
            echo "Success: manifest_us.bin generated."
          else
            echo "Error: manifest_us.bin was NOT generated!"
            exit 1
          fi

      # Step 2: Generate Launcher Icons
      - name: Generate Android launcher icons
        run: |
          if [ ! -f "master_icon.png" ]; then
            convert -size 1024x1024 xc:"#4B0082" -gravity center -fill "#FFD700" \
              -font DejaVu-Sans-Bold -pointsize 160 -annotate +0+0 "B.K.A" master_icon.png
          fi
          python3 runtime/generate_icons.py master_icon.png

      # Step 3: Prepare Source (THE DANGEROUS TOUCH IS GONE)
      - name: Prepare C++ Source for Build
        run: |
          python3 runtime/prepare_source.py
          # Note: We no longer 'touch' CMakeLists.txt. 
          # Your prepare_source.py v5 handles the selective wipe of game files.

      # Step 4: Build Application
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          # Running clean ensures CMake re-scans the 100+ files patched by Python
          ./gradlew clean assembleDebug --no-daemon --stacktrace
        working-directory: Android

      # Step 5: Verification (Proof the engine is actually in the APK)
      - name: Verify Shared Library
        run: |
          echo "Checking APK for native library..."
          APK_PATH=$(find Android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          
          if [ -f "$APK_PATH" ]; then
            echo "APK generated at $APK_PATH"
            # unzip -l lists contents. We MUST see libbkawrapper.so here.
            if unzip -l "$APK_PATH" | grep "libbkawrapper.so"; then
              echo "Verification Success: libbkawrapper.so is present in APK."
              unzip -l "$APK_PATH" | grep "libbkawrapper.so"
            else
              echo "CRITICAL ERROR: libbkawrapper.so is MISSING from the APK!"
              echo "Check your CMakeLists.txt source paths."
              exit 1
            fi
          else
            echo "Error: APK file was not found!"
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BKA-debug-apk
          path: "Android/app/build/outputs/apk/debug/*.apk"
