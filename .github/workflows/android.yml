name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip install PyYAML

      # Step 1: Generate Binary Asset Manifests
      # This script now creates manifest_us.bin and manifest_pal.bin in the assets folder
      - name: Generate Binary Asset Manifests
        run: |
          python3 runtime/generate_assets_header.py
          # Verify binary manifests exist in the Android assets directory
          if [ -f "Android/app/src/main/assets/manifest_us.bin" ]; then
            echo "Success: manifest_us.bin generated."
          else
            echo "Error: manifest_us.bin was NOT generated!"
            exit 1
          fi

      # Step 2: Generate Launcher Icons
      - name: Generate Android launcher icons
        run: |
          if [ ! -f "master_icon.png" ]; then
            convert -size 1024x1024 xc:"#4B0082" -gravity center -fill "#FFD700" \
              -font DejaVu-Sans-Bold -pointsize 160 -annotate +0+0 "B.K.A" master_icon.png
          fi
          python3 runtime/generate_icons.py master_icon.png

      - name: Prepare C++ Source for Build
        run: |
          python3 runtime/prepare_source.py

      # Step 3: Build Application
      - name: Build with Gradle
        run: |
          GRADLEW_PATH=$(find . -name gradlew)
          chmod +x "$GRADLEW_PATH"
          cd $(dirname "$GRADLEW_PATH")
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BKA-debug-apk
          path: "Android/app/build/outputs/apk/debug/*.apk"
