name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip install PyYAML

      - name: Generate Binary Asset Manifests
        run: |
          python3 runtime/generate_assets_header.py
          if [ ! -f "Android/app/src/main/assets/manifest_us.bin" ]; then
            echo "Error: manifest_us.bin not found!"
            exit 1
          fi

      - name: Generate Android launcher icons
        run: |
          if [ ! -f "master_icon.png" ]; then
            convert -size 1024x1024 xc:"#4B0082" -gravity center -fill "#FFD700" \
              -font DejaVu-Sans-Bold -pointsize 160 -annotate +0+0 "B.K.A" master_icon.png
          fi
          python3 runtime/generate_icons.py master_icon.png

      - name: Prepare C++ Source
        run: |
          # Patching game files via the harmonizer
          python3 runtime/prepare_source.py

      - name: Build with Gradle
        run: |
          # Robust finding of gradlew
          GRADLEW_PATH=$(find . -name gradlew)
          chmod +x "$GRADLEW_PATH"
          cd $(dirname "$GRADLEW_PATH")
          
          # Clean is critical here to force CMake to re-evaluate the new paths
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK Contents
        run: |
          echo "Verifying native library in APK..."
          APK_PATH=$(find . -name "*.apk" | grep "debug" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            if unzip -l "$APK_PATH" | grep "libbkawrapper.so"; then
              echo "Verification Success: libbkawrapper.so found."
            else
              echo "CRITICAL FAILURE: libbkawrapper.so is missing from APK!"
              exit 1
            fi
          else
            echo "Error: Debug APK not found."
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BKA-debug-apk
          path: "Android/app/build/outputs/apk/debug/*.apk"
