name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip install PyYAML

      # Step 1: Generate Binary Asset Manifests
      - name: Generate Binary Asset Manifests
        run: |
          python3 runtime/generate_assets_header.py
          if [ -f "Android/app/src/main/assets/manifest_us.bin" ]; then
            echo "Success: manifest_us.bin generated."
          else
            echo "Error: manifest_us.bin was NOT generated!"
            exit 1
          fi

      # Step 2: Generate Launcher Icons
      - name: Generate Android launcher icons
        run: |
          if [ ! -f "master_icon.png" ]; then
            convert -size 1024x1024 xc:"#4B0082" -gravity center -fill "#FFD700" \
              -font DejaVu-Sans-Bold -pointsize 160 -annotate +0+0 "B.K.A" master_icon.png
          fi
          python3 runtime/generate_icons.py master_icon.png

      # Step 3: Prepare Source and Force CMake Refresh
      - name: Prepare C++ Source for Build
        run: |
          python3 runtime/prepare_source.py
          # Touching CMakeLists.txt forces the NDK to re-scan for the injected .c files
          touch Android/app/src/main/cpp/CMakeLists.txt

      # Step 4: Build Application
      - name: Build with Gradle
        run: |
          GRADLEW_PATH=$(find . -name gradlew)
          chmod +x "$GRADLEW_PATH"
          cd $(dirname "$GRADLEW_PATH")
          # Clean is recommended once after source injection to ensure no stale objects
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      # Step 5: Robust Verification of Binary
      - name: Verify Shared Library
        run: |
          echo "Searching for native library..."
          # Broaden search to include intermediate folders where NDK outputs .so files
          SO_FILE=$(find Android/app/build -name "libbkawrapper.so" -type f | grep "arm64-v8a" | head -n 1)
          
          if [ -z "$SO_FILE" ]; then
            # Backup search in the .cxx directory if intermediates fail
            SO_FILE=$(find Android/app/.cxx -name "libbkawrapper.so" -type f | grep "arm64-v8a" | head -n 1)
          fi

          if [ -f "$SO_FILE" ]; then
            echo "Found Library at: $SO_FILE"
            echo "Final Binary Size:"
            ls -lh "$SO_FILE"
          else
            echo "Error: libbkawrapper.so for arm64-v8a not found!"
            echo "Listing build directory for debugging:"
            find Android/app/build -maxdepth 4
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BKA-debug-apk
          path: "Android/app/build/outputs/apk/debug/*.apk"
