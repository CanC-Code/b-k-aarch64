name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip install PyYAML  # Required for your asset scripts

      # ---------- Step 1: Use runtime/generate_assets_header.py ----------
      - name: Generate C++ Asset Headers
        run: |
          # This script populates Android/app/src/main/cpp/ultra/assets_manifest.h
          # It requires an assets.yaml to exist in the root.
          if [ -f "assets.yaml" ]; then
            python3 runtime/generate_assets_header.py
          else
            echo "assets.yaml not found, using existing headers if present."
          fi

      # ---------- Generate Launcher Icons ----------
      - name: Generate Android launcher icons
        run: |
          # 1. Create a clean 1024x1024 master if missing
          if [ ! -f "master_icon.png" ]; then
            convert -size 1024x1024 xc:"#4B0082" \
              -gravity center \
              -fill "#FFD700" \
              -font DejaVu-Sans-Bold \
              -pointsize 160 \
              -annotate +0+0 "B.K.A" \
              master_icon.png
          fi
          
          # 2. Run the updated script
          python3 runtime/generate_icons.py master_icon.png



      # ---------- Step 3: Build Application ----------
      - name: Build with Gradle
        run: |
          # Dynamically find gradlew in case of path shifts
          GRADLEW_PATH=$(find . -name gradlew)
          chmod +x "$GRADLEW_PATH"
          cd $(dirname "$GRADLEW_PATH")
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BKA-debug-apk
          path: Android/app/build/outputs/apk/debug/*.apk
