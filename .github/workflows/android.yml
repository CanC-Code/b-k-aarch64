name: Android Build
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip install PyYAML

      - name: Generate Binary Asset Manifests
        run: python3 runtime/generate_assets_header.py

      - name: Generate App Icons
        run: |
          # Ensure the resource directories exist so AAPT doesn't fail
          mkdir -p Android/app/src/main/res/mipmap-mdpi
          mkdir -p Android/app/src/main/res/mipmap-hdpi
          mkdir -p Android/app/src/main/res/mipmap-xhdpi
          mkdir -p Android/app/src/main/res/mipmap-xxhdpi
          
          if [ -f "master_icon.png" ]; then
            python3 runtime/generate_icons.py master_icon.png
          else
            echo "master_icon.png not found, creating placeholder icons"
            # Create a basic 48x48 icon so the manifest is satisfied
            convert -size 48x48 xc:gray Android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp Android/app/src/main/res/mipmap-mdpi/ic_launcher.png Android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          fi

      - name: Prepare C++ Source
        run: python3 runtime/prepare_source.py

      - name: Build with Gradle
        run: |
          set -o pipefail 
          GRADLEW_PATH=$(find . -name gradlew)
          chmod +x "$GRADLEW_PATH"
          cd $(dirname "$GRADLEW_PATH")
          ./gradlew assembleDebug --no-daemon --info 2>&1 | tee /tmp/build_full.log
        shell: bash

      - name: Inspect Build Errors on Failure
        if: failure()
        run: |
          grep -i "error:" /tmp/build_full.log | head -n 100 || echo "No explicit errors in log."

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BKA-debug-apk
          path: "Android/app/build/outputs/apk/debug/*.apk"
