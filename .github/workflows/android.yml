name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # ---------- Checkout ----------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ---------- Java ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ---------- ImageMagick ----------
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      # ---------- Generate Launcher Icons ----------
      # This ensures resources exist before AAPT attempts to link them
      - name: Generate Android launcher icons
        run: |
          RES_DIR=Android/app/src/main/res
          BASE_ICON=/tmp/ic_launcher.png
          ROUND_ICON=/tmp/ic_launcher_round.png

          # 1. Create the base canvas with text
          convert -size 1024x1024 xc:"#4B0082" \
            -gravity center \
            -fill "#FFD700" \
            -font DejaVu-Sans-Bold \
            -pointsize 160 \
            -annotate +0+0 "B.K.A" \
            "$BASE_ICON"

          # 2. Create the round version
          convert "$BASE_ICON" \
            \( -size 1024x1024 xc:none -fill white -draw "circle 512,512 512,0" \) \
            -compose copyopacity -composite \
            "$ROUND_ICON"

          # 3. Generate the specific density folders and icons
          # Sizes: mdpi:48, hdpi:72, xhdpi:96, xxhdpi:144, xxxhdpi:192
          declare -A DENSITIES=( ["mipmap-mdpi"]=48 ["mipmap-hdpi"]=72 ["mipmap-xhdpi"]=96 ["mipmap-xxhdpi"]=144 ["mipmap-xxxhdpi"]=192 )

          for DIR in "${!DENSITIES[@]}"; do
            SIZE=${DENSITIES[$DIR]}
            mkdir -p "$RES_DIR/$DIR"
            convert "$BASE_ICON" -resize ${SIZE}x${SIZE} "$RES_DIR/$DIR/ic_launcher.png"
            convert "$ROUND_ICON" -resize ${SIZE}x${SIZE} "$RES_DIR/$DIR/ic_launcher_round.png"
          done

      # ---------- Permissions ----------
      - name: Make gradlew executable
        run: chmod +x Android/gradlew

      # ---------- Build ----------
      # We run from the Android/ directory where gradlew resides
      - name: Build Debug APK
        working-directory: ./Android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # ---------- Upload ----------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BKA-debug-apk
          path: Android/app/build/outputs/apk/debug/*.apk
