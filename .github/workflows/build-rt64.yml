name: Build RT64 static library

on:
  workflow_dispatch:

jobs:
  build-rt64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate NDK and set environment
        run: |
          NDK_VERSION=$(ls $ANDROID_HOME/ndk | head -1)
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV

      - name: Configure RT64
        run: |
          mkdir -p rt64-build && cd rt64-build
          cmake -G Ninja ../Android/app/src/main/cpp/rt64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DRT64_STATIC=ON \
            -DPLUME_X11_ENABLED=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build RT64
        run: cmake --build rt64-build --target rt64 -j$(nproc)

      - name: Copy library and headers
        run: |
          mkdir -p artifact/lib/arm64-v8a artifact/include
          cp rt64-build/lib/librt64.a artifact/lib/arm64-v8a/
          cp -r Android/app/src/main/cpp/rt64/include artifact/include

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rt64-android
          path: artifact
