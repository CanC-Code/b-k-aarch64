name: Build & Verify

on:
  push:
    branches: [b-k-rebuild-android]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch ultralib gbi.h for 64-bit DL pointer recovery
        run: python3 tools/patch_ultralib_gbi.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate NDK and set environment
        run: |
          NDK_VERSION=$(ls $ANDROID_HOME/ndk | head -1)
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV

      - name: Patch ultralib gbi.h to register 64-bit DL pointers
        run: |
          python3 - <<'PYEOF'
          p = 'lib/ultralib/include/PR/gbi.h'
          with open(p) as f: t = f.read()

          anchor = '/*\n * DMA macros\n */\n#define gDma0p(pkt, c, s, l)'
          helper = '''/*
           * DMA macros
           *
           * bka: 64-bit host pointer recovery.
           */
          extern void bka_add_addr_mapping_c(unsigned int key, void *ptr);
          #define BKA_REG_DL_ADDR(s) do {                                   \\
                  unsigned long long __bka_a = (unsigned long long)(s);     \\
                  if (__bka_a != 0) {                                       \\
                      bka_add_addr_mapping_c((unsigned int)__bka_a,         \\
                                             (void *)__bka_a);              \\
                  }                                                         \\
              } while (0)

          #define gDma0p(pkt, c, s, l)'''
          if anchor not in t:
              raise SystemExit("anchor missing")
          t = t.replace(anchor, helper, 1)

          old1 = '''#define    gDma1p(pkt, c, s, l, p)    \\\\
          {                                          \\\\
                  Gfx *_g = (Gfx *)(pkt);            \\\\
                                                     \\\\
                  _g->words.w0 = (_SHIFTL((c), 24, 8) | _SHIFTL((p), 16, 8) | \\\\
                                  _SHIFTL((l), 0, 16));                               \\\\
                  _g->words.w1 = (unsigned int)(s);  \\\\
          }'''
          new1 = '''#define    gDma1p(pkt, c, s, l, p)    \\\\
          {                                          \\\\
                  Gfx *_g = (Gfx *)(pkt);            \\\\
                  BKA_REG_DL_ADDR(s);                \\\\
                  _g->words.w0 = (_SHIFTL((c), 24, 8) | _SHIFTL((p), 16, 8) | \\\\
                                  _SHIFTL((l), 0, 16));                               \\\\
                  _g->words.w1 = (unsigned int)(s);  \\\\
          }'''
          if old1 not in t:
              raise SystemExit("gDma1p block missing")
          t = t.replace(old1, new1, 1)

          old2 = '''#define gDma2p(pkt, c, adrs, len, idx, ofs)\\\\
          {                                          \\\\
                  Gfx *_g = (Gfx *)(pkt);            \\\\
                  _g->words.w0 = (_SHIFTL((c),24,8)|_SHIFTL(((len)-1)/8,19,5)|        \\\\
                                  _SHIFTL((ofs)/8,8,8)|_SHIFTL((idx),0,8));   \\\\
                  _g->words.w1 = (unsigned int)(adrs);\\\\
          }'''
          new2 = '''#define gDma2p(pkt, c, adrs, len, idx, ofs)\\\\
          {                                          \\\\
                  Gfx *_g = (Gfx *)(pkt);            \\\\
                  BKA_REG_DL_ADDR(adrs);             \\\\
                  _g->words.w0 = (_SHIFTL((c),24,8)|_SHIFTL(((len)-1)/8,19,5)|        \\\\
                                  _SHIFTL((ofs)/8,8,8)|_SHIFTL((idx),0,8));   \\\\
                  _g->words.w1 = (unsigned int)(adrs);\\\\
          }'''
          if old2 not in t:
              raise SystemExit("gDma2p block missing")
          t = t.replace(old2, new2, 1)

          with open(p, 'w') as f:
              f.write(t)
          print("gbi.h patched in CI")
          PYEOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Clean previous build
        run: |
          rm -rf Android/app/.cxx
          rm -rf Android/app/build

      - name: Build APK
        id: build
        run: |
          cd Android
          gradle assembleDebug \
            -Pandroid.externalNativeBuild.cmake.arguments="-DEXCLUDE_GAME_SRC=OFF" \
            --stacktrace 2>&1 | tee ../build.log
          echo "EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Build Succeeded
        if: steps.build.outputs.EXIT_CODE == '0'
        run: |
          echo "### Build Passed!" >> $GITHUB_STEP_SUMMARY

      - name: Build Failed — Show Errors
        if: steps.build.outputs.EXIT_CODE != '0'
        run: |
          echo "### Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^[^[]*error:|^.*FAILED:|BUILD FAILED" build.log | tail -n 60 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: steps.build.outputs.EXIT_CODE == '0'
        uses: actions/upload-artifact@v4
        with:
          name: bka-debug-apk
          path: Android/app/build/outputs/apk/debug/*.apk
