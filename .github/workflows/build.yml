name: Build & Verify

on:
  push:
    branches: [b-k-rebuild-android]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate NDK and set environment
        run: |
          NDK_VERSION=$(ls $ANDROID_HOME/ndk | head -1)
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV

      - name: Build RT64 wrapper shared library
        run: |
          mkdir -p rt64-wrapper-build && cd rt64-wrapper-build
          cmake -G Ninja ../Android/app/src/main/cpp/rt64_wrapper \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . --target rt64_wrapper -j$(nproc)
          mkdir -p ../Android/app/src/main/cpp/libs/arm64-v8a
          cp librt64_wrapper.so ../Android/app/src/main/cpp/libs/arm64-v8a/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build host tools (file_to_c)
        run: |
          g++ -std=c++17 -O2 -o file_to_c Android/app/src/main/cpp/rt64/src/tools/file_to_c/file_to_c.cpp
          chmod +x file_to_c
          echo "$PWD" >> $GITHUB_PATH

      - name: Clean previous build
        run: |
          rm -rf Android/app/.cxx
          rm -rf Android/app/build

      - name: Build APK
        id: build
        run: |
          cd Android
          gradle assembleDebug \
            -Pandroid.externalNativeBuild.cmake.arguments="-DEXCLUDE_GAME_SRC=OFF" \
            --stacktrace 2>&1 | tee ../build.log
          echo "EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Build Succeeded
        if: steps.build.outputs.EXIT_CODE == '0'
        run: |
          echo "### Build Passed!" >> $GITHUB_STEP_SUMMARY

      - name: Build Failed — Show Errors
        if: steps.build.outputs.EXIT_CODE != '0'
        run: |
          echo "### Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^[^[]*error:|^.*FAILED:|BUILD FAILED" build.log | tail -n 60 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: steps.build.outputs.EXIT_CODE == '0'
        uses: actions/upload-artifact@v4
        with:
          name: bka-debug-apk
          path: Android/app/build/outputs/apk/debug/*.apk
