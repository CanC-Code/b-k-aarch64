plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bkawrapper'
    compileSdk 34

    defaultConfig {
        applicationId "com.bkawrapper"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                // The -include flag ensures that types like u8, u32, and s32 are defined 
                // for every file before other headers are processed.
                cppFlags "-std=c++17 -include ${projectDir}/src/main/cpp/include/2.0L/PR/ultratypes.h"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            version "3.22.1"
            path file("src/main/cpp/CMakeLists.txt")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        prefab true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // REQUIRED: This allows OtrService to talk to MainActivity safely
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
}
