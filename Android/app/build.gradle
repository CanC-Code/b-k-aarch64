plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bkawrapper'
    compileSdk 34

    defaultConfig {
        applicationId "com.bkawrapper"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            // Add both 64-bit and 32-bit if desired
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                // Use default NDK CMake version
                path "src/main/cpp/CMakeLists.txt"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            ndk {
                debugSymbolLevel 'FULL'  // full debug symbols for native code
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1" // optional, override default if needed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}